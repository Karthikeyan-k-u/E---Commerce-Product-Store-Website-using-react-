<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="monoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#07090e" />
  <ellipse cx="50" cy="50" rx="38" ry="18" fill="none" stroke="url(#monoGrad)" stroke-width="3" transform="rotate(-25 50 50)" opacity="0.6" />
  <circle cx="26" cy="36" r="4" fill="#06b6d4" filter="url(#glow)" />
  <text x="50" y="54" text-anchor="middle" dominant-baseline="central" font-family="'Outfit', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="48" letter-spacing="-2" fill="#ffffff">WM</text>
</svg>